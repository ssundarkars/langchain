[project]
name = "nlp"
version = "0.1.0"
description = "Learning Gen AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "chroma>=0.2.0",
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.25.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-deepseek>=1.1.0",
    "langchain-google-genai>=4.3.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.1",
    "numpy>=2.5.1",
    "openai>=2.49.0",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv.workspace]
members = [
    "langgraph",
]
